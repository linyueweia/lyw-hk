#==========================================================================
# 为 HINLINK H88K (RK3588) 构建可启动的飞牛 fnOS ARM64 固件镜像
#
# 方案 = lyw-kf（KICKPI K1）同款，按 H88K 裁剪：
#   · 不注入 u-boot（H88K 现有厂商 u-boot 走 distro boot，用户口径：U-Boot 不动）
#   · 不注入树外模块（基镜像内核 6.18.18.c951-trim 已带 STMMAC/R8169/REALTEK_PHY/NVME）
#   · 三件事：注入厂商金标准 DTB、fnEnv（fdtfile + cma=2G）、board.json
#   · DTB 门禁（dtc 编译 + 金标准断言 + 与厂商实机底本差异面受控）作为硬门禁
#   · 镜像自证不过就不出产物
#==========================================================================
name: Build fnOS HINLINK H88K Image

on:
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: "基镜像 release tag；latest=自适应最新正式版（推荐）"
        required: false
        default: "latest"
        type: string
      base_image_asset:
        description: "基镜像资产名"
        required: false
        default: "fnnas-official-arm64-image_rockchip.img.gz"
        type: string
      base_image_sha256:
        description: "基镜像(解压后) sha256；留空跳过断言"
        required: false
        # v1.1.0 的 CI 实测解压 sha256 —— 首次发布后回填，回填前留空跳过断言
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "dts/**"
      - "dist/**"
      - "refs/**"
      - "*.sh"
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: write

env:
  TZ: Etc/UTC

jobs:
  build:
    name: Assemble fnOS image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (基镜像 + 产物 xz 需要空间)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils btrfs-progs device-tree-compiler \
                                     e2fsprogs fdisk gawk

      - name: DTB 门禁（dtc 编译 + 金标准断言 + 差异面）
        run: |
          set -e
          chmod +x tools/verify-dtb.sh
          bash tools/verify-dtb.sh

      - name: Fetch and unpack fnOS base image
        run: |
          set -e
          REPO="linyueweia/fnnas-base-images"
          TAG="${{ inputs.base_image_tag || 'latest' }}"
          ASSET="fnnas-official-arm64-image_rockchip.img.gz"
          if [[ "$TAG" == "latest" ]]; then
            # 自适应：取最新正式基镜像 release（排除 src-* 源档 / draft / prerelease）
            TAG="$(curl -sf https://api.github.com/repos/$REPO/releases \
              | jq -r '[.[] | select((.draft|not) and (.prerelease|not) and ((.tag_name|startswith("src-"))|not))][0].tag_name')"
            [[ -n "$TAG" && "$TAG" != "null" ]] || { echo "::error::拿不到 $REPO 的最新基镜像 tag"; exit 1; }
          fi
          echo "基镜像 tag = $TAG（手动指定或 latest 自适应）"
          mkdir -p base
          URL="https://github.com/$REPO/releases/download/${TAG}/${ASSET}"
          echo "  下载: $URL"
          curl -fL --retry 3 -o "base/$ASSET" "$URL"
          gzip -t "base/$ASSET"
          # 完整性双校验：release 随附 SHA256SUMS（gz + 解压后 raw 各一道）
          curl -fL --retry 3 -o base/SHA256SUMS "https://github.com/$REPO/releases/download/${TAG}/SHA256SUMS"
          grep " ${ASSET}$" base/SHA256SUMS | (cd base && sha256sum -c -)
          echo "  ✓ gz 校验通过（$TAG）"
          # 可选覆盖：显式给了 base_image_sha256 就再断言 raw（换版时用于钉死）
          EXPECT_SHA="${{ inputs.base_image_sha256 || '' }}"
          # 解压成正式文件名（SHA256SUMS 里 raw 行的名字），校验过后再改名给下游用
          RAW_NAME="fnnas-official-arm64-image_rockchip.img"
          gunzip -c "base/$ASSET" > "base/$RAW_NAME"
          rm -f "base/$ASSET"
          RAW_LINE="$(grep " ${RAW_NAME}$" base/SHA256SUMS || true)"
          if [[ -n "$RAW_LINE" ]]; then
            echo "$RAW_LINE" | (cd base && sha256sum -c -) || { echo "::error::raw 与 SHA256SUMS 不符"; exit 1; }
            echo "  ✓ raw 校验通过"
          fi
          EXPECT_SHA="${{ inputs.base_image_sha256 || '' }}"
          RAW_GOT="$(sha256sum "base/$RAW_NAME" | awk '{print $1}')"
          if [[ -n "$EXPECT_SHA" && "$RAW_GOT" != "$EXPECT_SHA" ]]; then
            echo "::error::raw sha256 与显式输入不符：期望 $EXPECT_SHA 实得 $RAW_GOT"; exit 1
          fi
          mv "base/$RAW_NAME" base/fnnas-base.img
          sudo parted -s base/fnnas-base.img unit s print || true
      - name: Assemble fnOS image
        run: |
          set -e
          sudo -E BASE=base/fnnas-base.img \
                  DTB=dist/rk3588-hinlink-h88k.dtb \
                  UBOOT=uboot/fnos-rk3588-first32m.bin \
                  BUILD_NUM="${{ github.run_number }}" \
                  OUT_DIR=out \
                  bash build-h88k-fnos.sh
          ls -la out/

      - name: 镜像自证（硬门禁）
        run: |
          set -e
          IMG="$(ls out/*.img | head -1)"
          sudo -E DTB=dist/rk3588-hinlink-h88k.dtb UBOOT=uboot/fnos-rk3588-first32m.bin bash tools/verify-image.sh "$IMG"

      - name: Show outputs
        run: |
          ls -la out/
          cat out/SHA256SUMS || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnos-hinlink-h88k-${{ github.run_number }}
          path: |
            out/*.img.xz
            out/SHA256SUMS
          retention-days: 14
          compression-level: 0

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fnos_hinlink-h88k_${{ github.run_number }}
          name: fnOS HINLINK H88K #${{ github.run_number }}
          body: |
            为 HINLINK H88K (RK3588) 构建的飞牛 fnOS ARM64 镜像（整盘 raw 镜像，写 eMMC）。

            - U-Boot：飞牛官方 RK3588 通用件（U-Boot 2026.04-TRIM，RKNS@0x8000 + FIT@0x800000，
              boot_targets 含 mmc1/SD），注入 [17408,32MiB)；板上原 2017.09_armbian 件已弃用
              （在 H88K 上 mmc dev 1 初始化必失败）。
            - DTB：厂商实机 iNextOS 金标准底本 + 8 项改造（删 cma 固定区 / 加 PMIC 断电属性 /
              rockchip,iommu-v2 → rockchip,rk3588-iommu 21 处对齐主线 6.18）。
            - CMA=2G（fnEnv extraargs），DTB 门禁 + 镜像自证（整片 32MiB 逐字节）均通过。

            ⚠ 启动介质：**本板只能从 eMMC 启动**。刷进 TF 卡不会引导（BootROM 优先 eMMC，
            且 eMMC 里的 u-boot 初始化不了 SD 槽——实测 mmc dev 1 连续 4 次全失败）。
            整盘 dd 到 eMMC，或在 MASKROM 下按地址分段写。
          files: |
            out/*.img.xz
            out/SHA256SUMS
          fail_on_unmatched_files: true
